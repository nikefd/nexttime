name: Submit App Store Release

on:
  push:
    tags: ["release-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: New App Store version, for example 1.1.0
        required: true
        type: string
      release_notes_zh:
        description: Simplified Chinese What's New text
        required: true
        default: 新增 6 周渐进计划与 24 个课程，优化自然语音、个性化状态检查和安全反馈，并更新“了解”页的恢复、同意、安全与资料来源说明。
        type: string

concurrency:
  group: publish-app-store
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 60
    environment: app-store-production
    env:
      APP_IDENTIFIER: com.zhangyangbin.NextTime
      APPLE_TEAM_ID: V59XFX9635
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MANUAL_VERSION: ${{ inputs.version }}
      MANUAL_RELEASE_NOTES_ZH: ${{ inputs.release_notes_zh }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Resolve release details
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "APP_VERSION=$MANUAL_VERSION" >> "$GITHUB_ENV"
            echo "APP_STORE_RELEASE_NOTES_ZH=$MANUAL_RELEASE_NOTES_ZH" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=${GITHUB_REF_NAME#release-v}" >> "$GITHUB_ENV"
            echo "APP_STORE_RELEASE_NOTES_ZH=更新 App Store 商店页与产品展示，突出 6 周渐进计划、24 节课程、自然语音、本地隐私和一次买断 Pro。" >> "$GITHUB_ENV"
          fi
      - name: Select Xcode 26.2
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          bundler-cache: true
      - name: Prepare Match SSH key
        shell: bash
        env:
          MATCH_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/match-ssh"
          printf '%s\n' "$MATCH_KEY" > "$RUNNER_TEMP/match-ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/match-ssh/id_ed25519"
          echo "MATCH_GIT_PRIVATE_KEY_PATH=$RUNNER_TEMP/match-ssh/id_ed25519" >> "$GITHUB_ENV"
      - name: Build and submit for review
        run: bundle exec fastlane ios release
      - name: Upload IPA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: NextTime-${{ env.APP_VERSION }}
          path: artifacts/*.ipa
