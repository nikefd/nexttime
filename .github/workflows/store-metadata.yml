name: Update App Store Metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - fastlane/Fastfile
      - fastlane/store_metadata/**
      - .github/workflows/store-metadata.yml

concurrency:
  group: update-app-store-metadata
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-26
    timeout-minutes: 20
    environment: app-store-production
    env:
      APP_IDENTIFIER: com.zhangyangbin.NextTime
      APPLE_TEAM_ID: V59XFX9635
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Update live metadata
        id: publish
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bundle exec fastlane ios store_metadata 2>&1 | tee store-metadata-run.log
      - name: Publish metadata result branch
        if: always()
        shell: bash
        run: |
          install -d fastlane/store_metadata
          printf '%s\n' "${{ steps.publish.outcome }}" > fastlane/store_metadata/LAST_RUN_STATUS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/store-metadata-results
          git add -f fastlane/store_metadata/LAST_RUN_STATUS.txt store-metadata-run.log
          git commit --allow-empty -m "chore: publish App Store metadata result"
          git push --force origin HEAD:refs/heads/automation/store-metadata-results
      - name: Fail when metadata publishing failed
        if: steps.publish.outcome != 'success'
        run: exit 1
