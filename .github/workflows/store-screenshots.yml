name: Capture App Store Screenshots

on:
  workflow_dispatch:
  push:
    tags: ["screenshots-v*"]

concurrency:
  group: capture-app-store-screenshots
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  mark-queued:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publish queued status
        shell: bash
        run: |
          install -d fastlane/screenshots
          printf '%s\n' queued > fastlane/screenshots/LAST_RUN_STATUS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/store-screenshot-results
          git add -f fastlane/screenshots/LAST_RUN_STATUS.txt
          git commit -m "chore: mark App Store screenshots queued"
          git push --force origin HEAD:refs/heads/automation/store-screenshot-results

  capture:
    needs: mark-queued
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Mark screenshot workflow as started
        shell: bash
        run: git push --force origin HEAD:refs/heads/automation/store-screenshot-results
      - name: Select Xcode 26.2
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Capture current Chinese UI
        id: capture
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: |
          set -o pipefail
          xcodebuild -version | tee store-screenshot-run.log
          bundle exec fastlane snapshot 2>&1 | tee -a store-screenshot-run.log
      - name: Upload screenshot artifact
        if: steps.capture.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: nexttime-app-store-screenshots
          path: fastlane/screenshots/zh-Hans/*.png
          if-no-files-found: error
      - name: Publish screenshot result branch
        if: always()
        shell: bash
        run: |
          install -d fastlane/screenshots
          printf '%s\n' "${{ steps.capture.outcome }}" > fastlane/screenshots/LAST_RUN_STATUS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/store-screenshot-results
          git add -f fastlane/screenshots store-screenshot-run.log
          git commit --allow-empty -m "chore: publish App Store screenshot result"
          git push --force origin HEAD:refs/heads/automation/store-screenshot-results
      - name: Fail when screenshot capture failed
        if: steps.capture.outcome != 'success'
        run: exit 1
