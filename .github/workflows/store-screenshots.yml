name: Capture App Store Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - NextTime/NextTime/NextTimeApp.swift
      - NextTime/NextTimeUITests/**
      - fastlane/Snapfile
      - .github/workflows/store-screenshots.yml

concurrency:
  group: capture-app-store-screenshots
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.2
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Capture current Chinese UI
        run: bundle exec fastlane snapshot
      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v7
        with:
          name: nexttime-app-store-screenshots
          path: fastlane/screenshots/zh-Hans/*.png
          if-no-files-found: error
      - name: Commit generated screenshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fastlane/screenshots/zh-Hans/*.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh App Store screenshots"
          git push
