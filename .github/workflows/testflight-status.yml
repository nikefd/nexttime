name: Verify TestFlight Build

on:
  workflow_dispatch:
    inputs:
      app_identifier:
        description: App bundle identifier to verify
        required: true
        default: com.zhangyangbin.NextTime
        type: string
      version:
        description: TestFlight version to verify
        required: true
        default: 1.3.6
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 10
    environment: testflight
    env:
      APP_IDENTIFIER: ${{ inputs.app_identifier }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      APP_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          bundler-cache: true
      - name: Check TestFlight processing status
        run: bundle exec fastlane ios testflight_status
