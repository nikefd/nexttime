name: Publish TestFlight

on:
  push:
    tags: ["beta-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: App version, for example 1.1.0
        required: true
        type: string
      release_notes:
        description: TestFlight release notes
        required: false
        type: string

concurrency:
  group: publish-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 45
    environment: testflight
    env:
      APP_IDENTIFIER: com.zhangyangbin.NextTime
      APPLE_TEAM_ID: V59XFX9635
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      MANUAL_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Resolve version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "APP_VERSION=$MANUAL_VERSION" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=${GITHUB_REF_NAME#beta-v}" >> "$GITHUB_ENV"
            if [[ -z "$RELEASE_NOTES" ]]; then
              echo "RELEASE_NOTES=首页新增可选课程列表，可自由浏览 18 节个人练习；明确标记免费与 Pro 课程，更新购买页权益说明，已购用户显示已解锁状态。" >> "$GITHUB_ENV"
            fi
          fi
      - name: Select Xcode 26.2
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          bundler-cache: true
      - name: Prepare Match SSH key
        shell: bash
        env:
          MATCH_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/match-ssh"
          printf '%s\n' "$MATCH_KEY" > "$RUNNER_TEMP/match-ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/match-ssh/id_ed25519"
          echo "MATCH_GIT_PRIVATE_KEY_PATH=$RUNNER_TEMP/match-ssh/id_ed25519" >> "$GITHUB_ENV"
      - name: Build and publish
        run: bundle exec fastlane ios beta
      - name: Upload IPA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: NextTime-${{ env.APP_VERSION }}
          path: artifacts/*.ipa
